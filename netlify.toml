[build]
  command = "npm run build"
  publish = ".next"
  # Save free-plan credits: only build when a commit message contains [deploy],
  # or on the very first build / a manual "Trigger deploy" retry.
  # (Exit 0 = skip this build, exit 1 = build.)
  ignore = "if git log -1 --pretty=%B | grep -q '\\[deploy\\]'; then exit 1; elif [ -z \"$CACHED_COMMIT_REF\" ] || [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; else exit 0; fi"

[build.environment]
  NODE_VERSION = "22"
